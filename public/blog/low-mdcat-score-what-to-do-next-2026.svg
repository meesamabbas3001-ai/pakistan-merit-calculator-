    <rect x="28" y="86" width="294" height="52" rx="10" fill="#0f766e"/>
    <text x="175" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">BDS — 50% MDCAT</text>
