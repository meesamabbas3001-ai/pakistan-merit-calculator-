<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="100" cy="570" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="990" cy="530" r="90" fill="#fbbf24" opacity="0.12"/>

  <!-- application card -->
  <g transform="translate(760,110)">
    <rect x="0" y="0" width="360" height="410" rx="22" fill="url(#card)"/>
    <rect x="28" y="28" width="220" height="16" rx="8" fill="#0f766e"/>
    <rect x="28" y="56" width="150" height="10" rx="5" fill="#94a3b8"/>
    <!-- tooth -->
    <path d="M180 110 C130 110 100 150 100 200 C100 250 118 300 128 350 C133 378 148 378 152 350 C156 322 162 300 180 300 C198 300 204 322 208 350 C212 378 227 378 232 350 C242 300 260 250 260 200 C260 150 230 110 180 110 Z" fill="#0d9488"/>
    <circle cx="150" cy="185" r="14" fill="#ffffff" opacity="0.35"/>
    <circle cx="205" cy="160" r="9" fill="#ffffff" opacity="0.3"/>
    <text x="180" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#0f766e">BDS</text>
    <text x="180" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">Punjab 2026-27</text>
  </g>

  <!-- headline -->
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <text x="80" y="170" font-size="62" font-weight="bold">APPLY FOR BDS</text>
    <text x="80" y="240" font-size="62" font-weight="bold">IN PUNJAB</text>
    <text x="80" y="310" font-size="30" fill="#a5f3fc">Public dental colleges 2026-27</text>
    <text x="80" y="352" font-size="30" fill="#a5f3fc">UHS application guide</text>
  </g>

  <!-- pills -->
  <g font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    <rect x="80" y="410" width="330" height="52" rx="26" fill="#fbbf24"/>
    <text x="245" y="444" text-anchor="middle" fill="#0f2a3d">15-30 DEC 2026</text>
    <rect x="80" y="478" width="280" height="52" rx="26" fill="#ffffff"/>
    <text x="220" y="512" text-anchor="middle" fill="#0f766e">Rs 2,000 FEE</text>
    <rect x="380" y="478" width="330" height="52" rx="26" fill="#ffffff"/>
    <text x="545" y="512" text-anchor="middle" fill="#0f766e">MDCAT 50% FLOOR</text>
  </g>
</svg>
