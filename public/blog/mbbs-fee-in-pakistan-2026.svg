<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1090" cy="90" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="70" cy="560" r="150" fill="#ffffff" opacity="0.04"/>
  <!-- rupee / fee-card motif -->
  <g opacity="0.95">
    <rect x="860" y="100" width="270" height="380" rx="18" fill="#ffffff" opacity="0.10"/>
    <rect x="890" y="130" width="210" height="22" rx="11" fill="#fde68a" opacity="0.9"/>
    <rect x="890" y="175" width="150" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="890" y="200" width="110" height="12" rx="6" fill="#ffffff" opacity="0.30"/>
    <circle cx="995" cy="290" r="58" fill="none" stroke="#fde68a" stroke-width="6"/>
    <text x="995" y="312" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#fde68a" text-anchor="middle">Rs</text>
    <rect x="890" y="372" width="210" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="890" y="392" width="150" height="10" rx="5" fill="#ffffff" opacity="0.30"/>
    <rect x="890" y="420" width="210" height="34" rx="17" fill="url(#badge)"/>
    <text x="995" y="443" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#022c22" text-anchor="middle">PMDC CAP 1.89M</text>
  </g>
  <!-- headline -->
  <text x="70" y="130" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fde68a" letter-spacing="3">MBBS FEE IN PAKISTAN 2026</text>
  <text x="70" y="200" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">Public vs Private</text>
  <text x="70" y="262" font-family="Arial, sans-serif" font-size="30" fill="#ccfbf1">Rs 50,000 a year — or Rs 1.89 million?</text>
  <text x="70" y="310" font-family="Arial, sans-serif" font-size="24" fill="#d1fae5">The complete fee guide: caps, deposits,</text>
  <text x="70" y="344" font-family="Arial, sans-serif" font-size="24" fill="#d1fae5">deadlines and five-year totals</text>
  <!-- pills -->
  <g font-family="Arial, sans-serif" font-size="21" font-weight="bold">
    <rect x="70" y="400" width="300" height="52" rx="26" fill="#ffffff" opacity="0.14"/>
    <rect x="70" y="400" width="300" height="52" rx="26" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="220" y="434" fill="#ffffff" text-anchor="middle">PUBLIC RS 50,000/YR</text>
    <rect x="390" y="400" width="290" height="52" rx="26" fill="#ffffff" opacity="0.14"/>
    <rect x="390" y="400" width="290" height="52" rx="26" fill="none" stroke="#fde68a" stroke-width="2"/>
    <text x="535" y="434" fill="#ffffff" text-anchor="middle">DEPOSIT RS 600,000</text>
    <rect x="70" y="472" width="330" height="52" rx="26" fill="url(#badge)"/>
    <text x="235" y="506" fill="#022c22" text-anchor="middle">5-YEAR TOTALS INSIDE</text>
  </g>
  <text x="70" y="590" font-family="Arial, sans-serif" font-size="20" fill="#99f6e4">pakistan-merit-calculator.vercel.app</text>
</svg>
