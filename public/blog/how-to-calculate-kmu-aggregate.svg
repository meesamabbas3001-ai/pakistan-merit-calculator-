<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1090" cy="90" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="110" cy="590" r="210" fill="#fbbf24" opacity="0.08"/>
  <!-- Khyber mountain ridge motif -->
  <g opacity="0.28" fill="#ffffff">
    <path d="M0 520 L150 400 L260 480 L380 360 L500 470 L640 380 L780 490 L920 400 L1060 500 L1200 430 L1200 630 L0 630 Z"/>
  </g>
  <!-- Title -->
  <text x="80" y="150" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#a7f3d0" letter-spacing="3">KHYBER MEDICAL UNIVERSITY</text>
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">KMU Aggregate 2026</text>
  <text x="80" y="300" font-family="Arial, sans-serif" font-size="32" fill="#e0f2fe">MBBS / BDS Merit Guide for KPK Students</text>
  <!-- Formula badges -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="360" width="200" height="120" rx="20" fill="url(#badge)"/>
    <text x="180" y="410" font-size="40" font-weight="800" fill="#78350f">SSC</text>
    <text x="180" y="455" font-size="44" font-weight="800" fill="#78350f">10%</text>
    <rect x="300" y="360" width="200" height="120" rx="20" fill="#ffffff" opacity="0.16"/>
    <rect x="300" y="360" width="200" height="120" rx="20" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="400" y="410" font-size="40" font-weight="800" fill="#ffffff">HSSC</text>
    <text x="400" y="455" font-size="44" font-weight="800" fill="#ffffff">40%</text>
    <rect x="520" y="360" width="220" height="120" rx="20" fill="#ffffff"/>
    <text x="630" y="410" font-size="40" font-weight="800" fill="#065f46">MDCAT</text>
    <text x="630" y="455" font-size="44" font-weight="800" fill="#065f46">50%</text>
  </g>
  <!-- Deadline pill -->
  <rect x="80" y="520" width="560" height="56" rx="28" fill="#dc2626"/>
  <text x="360" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Apply by 21 October 2026, 5:00 PM</text>
  <!-- Stethoscope accent -->
  <g opacity="0.85">
    <circle cx="1000" cy="180" r="42" fill="none" stroke="#fbbf24" stroke-width="10"/>
    <path d="M1000 222 C1000 285 955 305 955 345 C955 378 976 388 1000 388 C1024 388 1045 378 1045 345" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1045" cy="337" r="12" fill="#fbbf24"/>
  </g>
</svg>
