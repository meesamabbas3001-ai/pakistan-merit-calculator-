  <text x="70" y="200" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#ffffff">MDCAT Aggregate</text>
  <text x="70" y="290" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#fbbf24">Formula 2026</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" opacity="0.85">Official 10 / 40 / 50 rule, worked example</text>
