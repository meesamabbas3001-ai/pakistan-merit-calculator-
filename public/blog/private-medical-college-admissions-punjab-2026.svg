<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e22"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glowp" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#d1fae5" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sealp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgp)"/>
  <rect width="1200" height="630" fill="url(#glowp)"/>
  <circle cx="1100" cy="90" r="170" fill="#5eead4" opacity="0.10"/>
  <circle cx="90" cy="560" r="150" fill="#fbbf24" opacity="0.08"/>

  <!-- Title -->
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#ffffff">Private Medical Admissions</text>
  <text x="600" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fbbf24">Punjab 2026-27 &#8226; UHS Centralized</text>

  <!-- Left card: seats -->
  <g>
    <rect x="90" y="180" width="330" height="330" rx="22" fill="url(#cardp)"/>
    <rect x="90" y="180" width="330" height="330" rx="22" fill="none" stroke="#10b981" stroke-width="3" opacity="0.8"/>
    <!-- hospital building -->
    <g transform="translate(255,250)">
      <rect x="-52" y="-30" width="104" height="92" rx="8" fill="#0f766e"/>
      <rect x="-52" y="44" width="104" height="18" fill="#0b5d57"/>
      <rect x="-40" y="-14" width="22" height="22" fill="#ffffff" opacity="0.9"/>
      <rect x="-8" y="-14" width="22" height="22" fill="#ffffff" opacity="0.9"/>
      <rect x="24" y="-14" width="18" height="22" fill="#ffffff" opacity="0.9"/>
      <rect x="-40" y="16" width="22" height="22" fill="#ffffff" opacity="0.9"/>
      <rect x="-8" y="16" width="22" height="22" fill="#ffffff" opacity="0.9"/>
      <rect x="24" y="16" width="18" height="22" fill="#ffffff" opacity="0.9"/>
      <rect x="-12" y="-52" width="24" height="24" fill="#ffffff"/>
      <rect x="-4" y="-60" width="8" height="40" fill="#0f766e"/>
      <rect x="-20" y="-44" width="40" height="8" fill="#0f766e"/>
    </g>
    <text x="255" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#065f46">4,500</text>
    <text x="255" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">MBBS seats</text>
    <text x="255" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">34 private colleges</text>
    <text x="255" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">+ 1,100 BDS seats</text>
  </g>

  <!-- Middle card: deadline -->
  <g>
    <rect x="435" y="180" width="330" height="330" rx="22" fill="url(#cardp)"/>
    <rect x="435" y="180" width="330" height="330" rx="22" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
    <!-- calendar -->
    <g transform="translate(600,268)">
      <rect x="-56" y="-40" width="112" height="100" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="4"/>
      <rect x="-56" y="-40" width="112" height="30" rx="10" fill="#f59e0b"/>
      <rect x="-56" y="-20" width="112" height="10" fill="#f59e0b"/>
      <rect x="-32" y="-52" width="10" height="28" rx="5" fill="#92400e"/>
      <rect x="22" y="-52" width="10" height="28" rx="5" fill="#92400e"/>
      <text x="0" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#92400e">6</text>
      <text x="0" y="-18" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">NOV</text>
    </g>
    <text x="600" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#92400e">Deadline: 6 Nov</text>
    <text x="600" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">Apply 23 Oct &#8211; 6 Nov</text>
    <text x="600" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">1st list: 18 Nov 2026</text>
    <text x="600" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">3 days to deposit fee</text>
  </g>

  <!-- Right card: merit -->
  <g>
    <rect x="780" y="180" width="330" height="330" rx="22" fill="url(#cardp)"/>
    <rect x="780" y="180" width="330" height="330" rx="22" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.8"/>
    <!-- shield check -->
    <g transform="translate(945,268)">
      <path d="M0 -52 L46 -32 V6 C46 34 24 50 0 58 C-24 50 -46 34 -46 6 V-32 Z" fill="#0ea5e9"/>
      <path d="M-20 4 L-6 18 L22 -10" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="945" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#0c4a6e">Same merit rule</text>
    <text x="945" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">Matric 10% + FSc 40%</text>
    <text x="945" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">+ MDCAT 50%</text>
    <text x="945" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">MDCAT min 55% / 50%</text>
  </g>

  <!-- Bottom strip -->
  <rect x="90" y="540" width="1020" height="56" rx="14" fill="#ffffff" opacity="0.12"/>
  <text x="600" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">One UHS portal &#8226; All provinces + overseas eligible &#8226; Check each college&#8217;s own fee schedule</text>
</svg>
