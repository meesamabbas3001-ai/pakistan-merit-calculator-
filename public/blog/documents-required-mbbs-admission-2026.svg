<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="100" cy="570" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="990" cy="530" r="90" fill="#fbbf24" opacity="0.12"/>

  <!-- checklist card -->
  <g transform="translate(720,80)">
    <rect x="0" y="0" width="400" height="470" rx="22" fill="url(#card)"/>
    <rect x="28" y="28" width="220" height="16" rx="8" fill="#312e81"/>
    <rect x="28" y="56" width="160" height="10" rx="5" fill="#94a3b8"/>
    <rect x="28" y="92" width="344" height="56" rx="10" fill="#312e81"/>
    <text x="200" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">ADMISSION FILE CHECK</text>
    <g font-family="Arial, sans-serif" font-size="20" fill="#334155">
      <circle cx="48" cy="188" r="13" fill="#16a34a"/>
      <text x="42" y="195" font-size="16" font-weight="bold" fill="#ffffff">✓</text>
      <text x="72" y="195">Matric + FSc certificates</text>
      <circle cx="48" cy="238" r="13" fill="#16a34a"/>
      <text x="42" y="245" font-size="16" font-weight="bold" fill="#ffffff">✓</text>
      <text x="72" y="245">Domicile certificate</text>
      <circle cx="48" cy="288" r="13" fill="#16a34a"/>
      <text x="42" y="295" font-size="16" font-weight="bold" fill="#ffffff">✓</text>
      <text x="72" y="295">CNIC / B-Form + parent CNIC</text>
      <circle cx="48" cy="338" r="13" fill="#16a34a"/>
      <text x="42" y="345" font-size="16" font-weight="bold" fill="#ffffff">✓</text>
      <text x="72" y="345">MDCAT result card</text>
      <circle cx="48" cy="388" r="13" fill="#f59e0b"/>
      <text x="42" y="395" font-size="16" font-weight="bold" fill="#ffffff">!</text>
      <text x="72" y="395">Fitness certificate + affidavit</text>
    </g>
    <rect x="28" y="418" width="344" height="34" rx="17" fill="#e0e7ff"/>
    <text x="200" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#312e81">ORIGINALS READY • SCANS ≤ 500 KB</text>
  </g>

  <!-- left text -->
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#c7d2fe">MBBS / BDS ADMISSION 2026</text>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">Documents</text>
  <text x="70" y="285" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">Required</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="30" fill="#e0e7ff">Complete checklist for</text>
  <text x="70" y="390" font-family="Arial, sans-serif" font-size="30" fill="#e0e7ff">UHS • KMU • NUMS • SZABMU</text>
  <rect x="70" y="430" width="270" height="46" rx="23" fill="#fbbf24"/>
  <text x="205" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#451a03">NO SEAT WITHOUT PAPERS</text>
  <text x="70" y="540" font-family="Arial, sans-serif" font-size="21" fill="#c7d2fe">Originals • Attestation • Upload rules</text>
  <text x="70" y="575" font-family="Arial, sans-serif" font-size="21" fill="#c7d2fe">7 mistakes that cancel admissions</text>
</svg>
