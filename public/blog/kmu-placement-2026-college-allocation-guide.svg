<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="100" cy="570" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="990" cy="530" r="90" fill="#fbbf24" opacity="0.12"/>

  <!-- placement schedule card -->
  <g transform="translate(770,105)">
    <rect x="0" y="0" width="350" height="420" rx="22" fill="url(#card)"/>
    <rect x="28" y="28" width="200" height="16" rx="8" fill="#065f46"/>
    <rect x="28" y="56" width="150" height="10" rx="5" fill="#94a3b8"/>
    <rect x="28" y="88" width="294" height="54" rx="10" fill="#065f46"/>
    <text x="175" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">PLACEMENT SCHEDULE</text>
    <rect x="28" y="158" width="294" height="46" rx="10" fill="#ccfbf1"/>
    <text x="44" y="188" font-family="Arial, sans-serif" font-size="20" fill="#065f46">16 Nov: 97.77 – 94.87</text>
    <rect x="28" y="210" width="294" height="46" rx="10" fill="#e2e8f0"/>
    <text x="44" y="240" font-family="Arial, sans-serif" font-size="20" fill="#475569">17–19 Nov: down to 93.21</text>
    <rect x="28" y="262" width="294" height="46" rx="10" fill="#e2e8f0"/>
    <text x="44" y="292" font-family="Arial, sans-serif" font-size="20" fill="#475569">20 Nov: FSF / minorities</text>
    <rect x="28" y="314" width="294" height="46" rx="10" fill="#e2e8f0"/>
    <text x="44" y="344" font-family="Arial, sans-serif" font-size="20" fill="#475569">23 Nov: backward areas</text>
    <rect x="28" y="368" width="294" height="40" rx="10" fill="#f59e0b"/>
    <text x="175" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#451a03">REPORT 9:00 AM</text>
  </g>

  <!-- headline -->
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <text x="80" y="165" font-size="60" font-weight="bold">KMU PLACEMENT</text>
    <text x="80" y="235" font-size="60" font-weight="bold">2026</text>
    <text x="80" y="305" font-size="60" font-weight="bold">YOUR DAY, YOUR DATE</text>
    <text x="80" y="360" font-size="30" fill="#a7f3d0">Public MBBS / BDS — Khyber Pakhtunkhwa</text>
    <text x="80" y="402" font-size="30" fill="#a7f3d0">Interview dates, fee rule &amp; documents</text>
  </g>

  <!-- pills -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <rect x="80" y="450" width="340" height="52" rx="26" fill="#ffffff"/>
    <text x="250" y="484" text-anchor="middle" fill="#065f46">16–19 NOV OPEN MERIT</text>
    <rect x="440" y="450" width="280" height="52" rx="26" fill="#fbbf24"/>
    <text x="580" y="484" text-anchor="middle" fill="#451a03">FEE: 3 WORKING DAYS</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <rect x="80" y="520" width="340" height="52" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="250" y="554" text-anchor="middle" fill="#065f46">2ND ROUND: 1–4 DEC</text>
    <rect x="440" y="520" width="280" height="52" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="580" y="554" text-anchor="middle" fill="#065f46">3RD ROUND: 15–17 DEC</text>
  </g>
</svg>
