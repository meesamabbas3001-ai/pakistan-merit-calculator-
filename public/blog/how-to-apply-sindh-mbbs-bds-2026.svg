<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e22"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="90" cy="90" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="1150" cy="560" r="170" fill="#ffffff" opacity="0.04"/>
  <!-- file-folder accent -->
  <g opacity="0.9">
    <rect x="930" y="380" width="190" height="130" rx="14" fill="none" stroke="#fde68a" stroke-width="6" opacity="0.7"/>
    <path d="M930 410 h70 l24 24 h96" fill="none" stroke="#fde68a" stroke-width="6" opacity="0.7"/>
    <path d="M980 450 h90 M980 475 h90" stroke="#fde68a" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- deadline pill -->
  <g>
    <rect x="60" y="58" width="620" height="52" rx="26" fill="#b91c1c" opacity="0.95"/>
    <text x="370" y="92" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Sindh Applications Close: 26 October 2026</text>
  </g>
  <!-- title -->
  <text x="60" y="210" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="bold" fill="#ffffff">Apply: Sindh MBBS/BDS 2026</text>
  <text x="60" y="268" font-family="Verdana, Arial, sans-serif" font-size="38" fill="#a7f3d0">JSMU, LUMHS &amp; SMBBMU File Guide</text>
  <text x="60" y="322" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#d1fae5">Online form + printed file + Leopard Courier</text>
  <text x="60" y="358" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#d1fae5">step by step, before the deadline</text>
  <!-- step badges -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="420" width="300" height="120" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="210" y="468" font-size="32" font-weight="bold" fill="#fde68a">JSMU / LUMHS</text>
    <text x="210" y="504" font-size="24" fill="#ffffff">+ SMBBMU zones</text>
    <rect x="400" y="420" width="300" height="120" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="550" y="468" font-size="40" font-weight="bold" fill="#fde68a">Rs. 3,500</text>
    <text x="550" y="504" font-size="24" fill="#ffffff">per programme</text>
    <rect x="740" y="420" width="300" height="120" rx="18" fill="url(#badge)" opacity="0.95"/>
    <text x="890" y="468" font-size="32" font-weight="bold" fill="#052e22">2 Nov: MBBS list</text>
    <text x="890" y="504" font-size="24" font-weight="bold" fill="#052e22">Final: 6 Nov</text>
  </g>
  <!-- site tag -->
  <text x="60" y="600" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#a7f3d0" opacity="0.9">pakistan-merit-calculator.vercel.app</text>
</svg>
