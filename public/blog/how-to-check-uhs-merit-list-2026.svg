<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1090" cy="90" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="70" cy="560" r="150" fill="#ffffff" opacity="0.04"/>
  <!-- merit-list document motif -->
  <g opacity="0.95">
    <rect x="860" y="110" width="270" height="360" rx="18" fill="#ffffff" opacity="0.10"/>
    <rect x="890" y="140" width="210" height="22" rx="11" fill="#fde68a" opacity="0.9"/>
    <rect x="890" y="185" width="150" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="890" y="210" width="110" height="12" rx="6" fill="#ffffff" opacity="0.30"/>
    <rect x="890" y="245" width="34" height="34" rx="8" fill="none" stroke="#fde68a" stroke-width="5"/>
    <path d="M897 262 l10 10 20 -22" fill="none" stroke="#fde68a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="940" y="250" width="150" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="940" y="272" width="110" height="11" rx="5.5" fill="#ffffff" opacity="0.30"/>
    <rect x="890" y="305" width="34" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.7"/>
    <rect x="940" y="310" width="150" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="940" y="332" width="110" height="11" rx="5.5" fill="#ffffff" opacity="0.30"/>
    <rect x="890" y="365" width="34" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.7"/>
    <rect x="940" y="370" width="150" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="940" y="392" width="110" height="11" rx="5.5" fill="#ffffff" opacity="0.30"/>
  </g>
  <!-- headline -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="130" font-size="62" font-weight="bold" fill="#ffffff">How to Check the</text>
    <text x="70" y="200" font-size="62" font-weight="bold" fill="#ffffff">UHS Merit List 2026</text>
    <text x="70" y="260" font-size="30" fill="#c7d2fe">Punjab MBBS / BDS — public, private &amp; quota dates</text>
    <text x="70" y="310" font-size="26" fill="#e0e7ff">Provisional, final &amp; selection lists, step by step</text>
  </g>
  <!-- date badges -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold">
    <rect x="70" y="380" width="250" height="64" rx="14" fill="url(#badge)"/>
    <text x="195" y="422" text-anchor="middle" font-size="27" fill="#1e1b4b">13 NOV: LIST</text>
    <rect x="340" y="380" width="250" height="64" rx="14" fill="#ffffff" opacity="0.92"/>
    <text x="465" y="422" text-anchor="middle" font-size="27" fill="#1e1b4b">17 NOV: 1ST LIST</text>
