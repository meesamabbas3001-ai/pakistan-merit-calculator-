<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1100" cy="80" r="180" fill="#ffffff" opacity="0.05"/>
  <circle cx="120" cy="590" r="200" fill="#fbbf24" opacity="0.08"/>

  <!-- Document / list card stack -->
  <g>
    <rect x="830" y="150" width="280" height="330" rx="22" fill="#ffffff" opacity="0.10" transform="rotate(6 970 315)"/>
    <rect x="815" y="140" width="280" height="330" rx="22" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <!-- list rows -->
    <g stroke="#ffffff" stroke-opacity="0.65" stroke-width="5" stroke-linecap="round">
      <line x1="855" y1="200" x2="1055" y2="200"/>
      <line x1="855" y1="248" x2="1005" y2="248"/>
      <line x1="855" y1="296" x2="1055" y2="296"/>
      <line x1="855" y1="344" x2="980" y2="344"/>
      <line x1="855" y1="392" x2="1055" y2="392"/>
    </g>
    <circle cx="855" cy="430" r="14" fill="#fbbf24"/>
    <path d="M849 430 l4 4 l8 -9" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Magnifier over the list -->
  <g>
    <circle cx="720" cy="400" r="78" fill="none" stroke="#fbbf24" stroke-width="16"/>
    <line x1="775" y1="455" x2="840" y2="520" stroke="#fbbf24" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Headline text -->
  <g font-family="Arial, sans-serif">
    <text x="70" y="170" font-size="30" font-weight="700" fill="#bfdbfe" letter-spacing="4">2026-27 ADMISSIONS</text>
    <text x="70" y="260" font-size="72" font-weight="800" fill="#ffffff">Merit List</text>
    <text x="70" y="345" font-size="72" font-weight="800" fill="#fbbf24">Check Guide</text>
    <text x="70" y="420" font-size="30" fill="#dbeafe">UHS · KMU · SZABMU · JSMU · NUMS</text>
    <!-- Date chips -->
    <g font-weight="700" font-size="24">
      <rect x="70" y="470" width="200" height="60" rx="30" fill="#ffffff" opacity="0.16"/>
      <text x="170" y="509" text-anchor="middle" fill="#ffffff">Nov Lists</text>
      <rect x="290" y="470" width="230" height="60" rx="30" fill="#ffffff" opacity="0.16"/>
      <text x="405" y="509" text-anchor="middle" fill="#ffffff">2026-27</text>
    </g>
  </g>
</svg>
