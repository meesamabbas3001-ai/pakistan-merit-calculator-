<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a5c"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="150" cy="90" r="150" fill="#fbbf24" opacity="0.08"/>
  <circle cx="1070" cy="560" r="190" fill="#34d399" opacity="0.08"/>

  <!-- Title -->
  <text x="600" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">MBBS vs BDS 2026</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#e0f2fe">Merit &#8226; Fees &#8226; Scope — the honest comparison</text>

  <!-- Left card: MBBS -->
  <g>
    <rect x="90" y="180" width="440" height="330" rx="22" fill="url(#cardL)"/>
    <rect x="90" y="180" width="440" height="330" rx="22" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
    <rect x="90" y="180" width="440" height="70" rx="22" fill="#1e3a8a"/>
    <rect x="90" y="228" width="440" height="22" fill="#1e3a8a"/>
    <text x="310" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">MBBS</text>
    <!-- medical cross in circle -->
    <circle cx="310" cy="330" r="52" fill="#1e3a8a"/>
    <rect x="298" y="296" width="24" height="68" rx="6" fill="#ffffff"/>
    <rect x="276" y="318" width="68" height="24" rx="6" fill="#ffffff"/>
    <text x="310" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">5 years + house job</text>
    <text x="310" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">Specialization ladder</text>
    <text x="310" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">Long road, top rewards</text>
  </g>

  <!-- VS badge -->
  <circle cx="600" cy="345" r="52" fill="#fbbf24"/>
  <circle cx="600" cy="345" r="52" fill="none" stroke="#ffffff" stroke-width="5"/>
  <text x="600" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="800" fill="#0f2a5c">VS</text>

  <!-- Right card: BDS -->
  <g>
    <rect x="670" y="180" width="440" height="330" rx="22" fill="url(#cardR)"/>
    <rect x="670" y="180" width="440" height="330" rx="22" fill="none" stroke="#34d399" stroke-width="3" opacity="0.8"/>
    <rect x="670" y="180" width="440" height="70" rx="22" fill="#0e7490"/>
    <rect x="670" y="228" width="440" height="22" fill="#0e7490"/>
    <text x="890" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">BDS</text>
    <!-- tooth -->
    <path d="M890 278 c-34 0 -52 20 -52 46 c0 30 18 34 24 62 c5 24 10 52 26 52 c14 0 12 -30 14 -52 c1 -14 3 -22 8 -22 c5 0 7 8 8 22 c2 22 0 52 14 52 c16 0 21 -28 26 -52 c6 -28 24 -32 24 -62 c0 -26 -18 -46 -52 -46 c-14 0 -20 6 -40 6 c-20 0 -26 -6 -40 -6 z" fill="#0e7490"/>
    <text x="890" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0e7490">4 years + house job</text>
    <text x="890" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">Clinic ownership early</text>
    <text x="890" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#334155">Shorter road to earning</text>
  </g>

  <!-- Bottom strip: formula + fee facts -->
  <rect x="90" y="540" width="1020" height="56" rx="14" fill="#ffffff" opacity="0.12"/>
  <text x="600" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Same formula: Matric 10% + FSc 40% + MDCAT 50% &#160;&#160;|&#160;&#160; Public tuition Rs. 50,000/yr</text>
</svg>
