<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="90" cy="90" r="200" fill="#ffffff" opacity="0.05"/>
  <circle cx="1150" cy="560" r="170" fill="#ffffff" opacity="0.04"/>
  <!-- subtle dot pattern -->
  <g fill="#ffffff" opacity="0.07">
    <circle cx="620" cy="120" r="4"/><circle cx="690" cy="170" r="3"/><circle cx="760" cy="120" r="4"/>
    <circle cx="830" cy="180" r="3"/><circle cx="900" cy="130" r="4"/><circle cx="970" cy="190" r="3"/>
  </g>
  <!-- caduceus-inspired cross accent -->
  <g opacity="0.9">
    <circle cx="1010" cy="450" r="86" fill="none" stroke="#fde68a" stroke-width="5" opacity="0.5"/>
    <path d="M1010 400 v100 M974 436 h72 M982 484 l56 -96 M1038 484 l-56 -96" stroke="#fde68a" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- graduation-cap accent -->
  <g opacity="0.85">
    <path d="M150 480 L260 440 L370 480 L260 520 Z" fill="url(#badge)" opacity="0.85"/>
    <path d="M320 495 v55 c0 18 -110 38 -110 38 s-110 -20 -110 -38 v-55" fill="none" stroke="#fde68a" stroke-width="7" opacity="0.7"/>
    <circle cx="370" cy="490" r="8" fill="#fde68a"/>
  </g>
  <!-- deadline pill -->
  <g>
    <rect x="60" y="58" width="560" height="52" rx="26" fill="#b91c1c" opacity="0.95"/>
    <text x="340" y="92" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Sindh Admissions Deadline: 26 October 2026</text>
  </g>
  <!-- title -->
  <text x="60" y="210" font-family="Verdana, Arial, sans-serif" font-size="62" font-weight="bold" fill="#ffffff">DUHS Aggregate 2026</text>
  <text x="60" y="268" font-family="Verdana, Arial, sans-serif" font-size="38" fill="#99f6e4">Dow University MBBS/BDS Merit Guide</text>
  <text x="60" y="322" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#ccfbf1">Official formula, worked example, eligibility &amp;</text>
  <text x="60" y="358" font-family="Verdana, Arial, sans-serif" font-size="28" fill="#ccfbf1">the verified 2026-27 Sindh schedule</text>
  <!-- formula badges -->
  <g font-family="Verdana, Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="420" width="300" height="120" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="210" y="468" font-size="40" font-weight="bold" fill="#fde68a">10%</text>
    <text x="210" y="504" font-size="24" fill="#ffffff">SSC (Matric)</text>
    <rect x="400" y="420" width="300" height="120" rx="18" fill="#ffffff" opacity="0.12"/>
    <text x="550" y="468" font-size="40" font-weight="bold" fill="#fde68a">40%</text>
    <text x="550" y="504" font-size="24" fill="#ffffff">HSSC (Inter)</text>
    <rect x="740" y="420" width="300" height="120" rx="18" fill="url(#badge)" opacity="0.95"/>
    <text x="890" y="468" font-size="40" font-weight="bold" fill="#042f2e">50%</text>
    <text x="890" y="504" font-size="24" font-weight="bold" fill="#042f2e">MDCAT (of 180)</text>
  </g>
  <!-- site tag -->
  <text x="60" y="600" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#99f6e4" opacity="0.9">pakistan-merit-calculator.vercel.app</text>
