<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="0.55" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="100" cy="570" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="990" cy="530" r="90" fill="#fbbf24" opacity="0.12"/>

  <!-- final merit list card -->
  <g transform="translate(770,105)">
    <rect x="0" y="0" width="350" height="420" rx="22" fill="url(#card)"/>
    <rect x="28" y="28" width="200" height="16" rx="8" fill="#065f46"/>
    <rect x="28" y="56" width="150" height="10" rx="5" fill="#94a3b8"/>
    <rect x="28" y="88" width="294" height="54" rx="10" fill="#065f46"/>
    <text x="175" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">FINAL MERIT LIST</text>
    <rect x="28" y="158" width="294" height="46" rx="10" fill="#ccfbf1"/>
    <text x="44" y="188" font-family="Arial, sans-serif" font-size="20" fill="#065f46">MBBS / BDS 2026-27</text>
    <rect x="28" y="210" width="294" height="46" rx="10" fill="#e2e8f0"/>
    <text x="44" y="240" font-family="Arial, sans-serif" font-size="20" fill="#475569">cas.kmu.edu.pk</text>
    <rect x="28" y="272" width="294" height="46" rx="10" fill="#e2e8f0"/>
    <text x="44" y="302" font-family="Arial, sans-serif" font-size="20" fill="#475569">Placement: 16–21 Nov</text>
    <rect x="28" y="334" width="294" height="54" rx="12" fill="#f59e0b"/>
    <text x="175" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#451a03">FEE: 3 WORKING DAYS</text>
  </g>

  <!-- headline -->
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <text x="80" y="165" font-size="60" font-weight="bold">KMU FINAL MERIT</text>
    <text x="80" y="235" font-size="60" font-weight="bold">LIST 2026</text>
    <text x="80" y="305" font-size="60" font-weight="bold">WHAT TO EXPECT</text>
    <text x="80" y="360" font-size="30" fill="#a7f3d0">Public MBBS / BDS — Khyber Pakhtunkhwa</text>
    <text x="80" y="402" font-size="30" fill="#a7f3d0">Placement, fee deposit &amp; later rounds</text>
  </g>

  <!-- pills -->
  <g font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <rect x="80" y="450" width="330" height="52" rx="26" fill="#ffffff"/>
    <text x="245" y="484" text-anchor="middle" fill="#065f46">12 NOV: FINAL LIST</text>
    <rect x="430" y="450" width="290" height="52" rx="26" fill="#fbbf24"/>
    <text x="575" y="484" text-anchor="middle" fill="#451a03">16–21 NOV PLACEMENT</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="bold">
    <rect x="80" y="520" width="330" height="52" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="245" y="554" text-anchor="middle" fill="#065f46">2ND ROUND: 1–4 DEC</text>
    <rect x="430" y="520" width="290" height="52" rx="26" fill="#ffffff" opacity="0.92"/>
    <text x="575" y="554" text-anchor="middle" fill="#065f46">3RD ROUND: 15–17 DEC</text>
  </g>
</svg>
