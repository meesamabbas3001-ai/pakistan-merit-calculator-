<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#3730a3"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="100" cy="570" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="990" cy="530" r="90" fill="#fbbf24" opacity="0.12"/>

  <!-- headline -->
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#c7d2fe">SZABMU PRIVATE ADMISSIONS</text>
  <text x="70" y="180" font-family="Arial, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">MBBS / BDS 2026-27</text>
  <text x="70" y="235" font-family="Arial, sans-serif" font-size="30" fill="#e0e7ff">How to Apply — Step by Step</text>

  <!-- deadline pills -->
  <g font-family="Arial, sans-serif" font-weight="bold">
    <rect x="70" y="290" width="330" height="64" rx="32" fill="#f59e0b"/>
    <text x="235" y="331" text-anchor="middle" font-size="26" fill="#1e1b4b">DEADLINE: 27 NOV</text>
    <rect x="70" y="372" width="330" height="64" rx="32" fill="#ffffff"/>
    <text x="235" y="413" text-anchor="middle" font-size="26" fill="#1e1b4b">FEE: Rs 3,000</text>
    <rect x="70" y="454" width="330" height="64" rx="32" fill="#ffffff"/>
    <text x="235" y="495" text-anchor="middle" font-size="26" fill="#1e1b4b">LIST: 1 DEC 2026</text>
  </g>

  <!-- application form card -->
  <g transform="translate(770,95)">
    <rect x="0" y="0" width="350" height="440" rx="22" fill="url(#card)"/>
    <rect x="28" y="28" width="200" height="16" rx="8" fill="#1e1b4b"/>
    <rect x="28" y="56" width="150" height="10" rx="5" fill="#94a3b8"/>
    <rect x="28" y="86" width="294" height="52" rx="10" fill="#3730a3"/>
    <text x="175" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">CREATE ACCOUNT</text>
    <rect x="28" y="152" width="294" height="52" rx="10" fill="#e2e8f0"/>
    <text x="175" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1e1b4b">UPLOAD DOCUMENTS</text>
    <rect x="28" y="218" width="294" height="52" rx="10" fill="#e2e8f0"/>
    <text x="175" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1e1b4b">PICK PREFERENCES</text>
    <rect x="28" y="284" width="294" height="52" rx="10" fill="#e2e8f0"/>
    <text x="175" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#1e1b4b">PAY Rs 3,000 FEE</text>
    <rect x="28" y="356" width="294" height="52" rx="10" fill="#0e7490"/>
    <text x="175" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff">SUBMIT BEFORE 27 NOV</text>
  </g>

  <text x="70" y="590" font-family="Arial, sans-serif" font-size="24" fill="#c7d2fe">pakistan-merit-calculator.vercel.app</text>
</svg>
